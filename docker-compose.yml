# The fixed project name keeps the containers and volumes the same, whatever this folder is called.
# A downloaded release in a folder with a version in its name therefore finds the data of the previous one.
name: api-media

services:
  media:
    image: ghcr.io/lempki/api-media:latest
    build: .
    ports:
      - "8001:8000"
    env_file:
      # Optional settings. Without the file, the secret check below explains what to do.
      - path: .env
        required: false
    environment:
      # Compose reads the secret from .env or the shell and stops with this message when it is missing.
      API_SECRET: ${API_SECRET:?Set API_SECRET in .env. The README shows how to generate one.}
    volumes:
      # The image's working directory is /app, so YDL_COOKIES_FILE=cookies/youtube.txt works in and out of Docker.
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
