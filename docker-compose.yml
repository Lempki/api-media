services:
  media:
    build: .
    ports:
      - "8001:8000"
    env_file:
      # Optional settings. Without the file, the secret check below explains what to do.
      - path: .env
        required: false
    environment:
      # Compose reads the secret from .env or the shell and stops with this message when it is missing.
      DISCORD_API_SECRET: ${DISCORD_API_SECRET:?Set DISCORD_API_SECRET in .env. The README shows how to generate one.}
    restart: unless-stopped
