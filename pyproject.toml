[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-api-media"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cachetools>=5.5",
    "spotipy>=2.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "types-cachetools>=5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_api"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# yt-dlp and spotipy ship no type information.
[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.dev-standards.template]
package = "media_api"
