[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "api-media"
version = "2.2.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cachetools>=7.2.1",
    "spotipy>=2.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=2.13",
    "mypy>=2.4.0",
    "types-cachetools>=5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_api"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# yt-dlp and spotipy ship no type information.
[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.dev-standards.template]
package = "media_api"
